[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "back-tester-cmf"
version = "0.0.1"
description = "CMF Advanced Backtesting Engine for Options"
authors = [
    {name = "CMF Team", email = "cmfteam2018@gmail.com"},
]
dependencies = [
    "pandas>=2.2.0",
    "pyarrow>=24.0.0",
    "tqdm>=4.67.3",
]

requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}

[dependency-groups]
dev = [
    "cmake>=3.22",
    "ninja>=1.11",
    "pip>=24",
    "pre-commit>=4.5.1",
    "pyarrow>=17.0.0",
    "pytest>=8.3",
]
research = [
    "lightgbm>=4.6",
    "numpy>=2.2",
    "scikit-learn>=1.7",
    "scipy>=1.15",
    "torch>=2.7",
]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.define.BUILD_PYTHON_MODULE = true
cmake.define.BUILD_TESTS = false
cmake.define.BUILD_BENCHMARKS = false
cmake.define.BUILD_COMPONENT_PIPELINE = false
wheel.packages = ["python/back_tester"]

[tool.pytest.ini_options]
pythonpath = ["."]
