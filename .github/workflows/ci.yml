name: CI

on:
  pull_request:
    branches: [main, hw4/backtest-engine-options]
  push:
    branches: [main, hw4/backtest-engine-options]

jobs:
  test:
    runs-on: ubuntu-latest

    # The golden order log is only a determinism claim if it holds across
    # standard library implementations, so the suite runs on libstdc++ (g++)
    # and libc++-capable clang++ rather than one compiler.
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - {name: gcc, cc: gcc, cxx: g++}
          - {name: clang, cc: clang, cxx: clang++}

    name: test (${{ matrix.compiler.name }})

    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.13"

      - name: Sync environment
        run: uv sync --locked

      - name: Build editable package
        run: uv run pip install -e .

      - name: Import package outside source tree
        run: cd /tmp && "$GITHUB_WORKSPACE/.venv/bin/python" -c "import back_tester; print(back_tester.__file__); print(back_tester.version())"

      - name: Configure CMake
        run: uv run cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: uv run cmake --build build -j2

      - name: Run tests
        run: uv run ctest --test-dir build --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.13"

      - name: Sync environment
        run: uv sync --locked

      - name: Run pre-commit
        run: uv run pre-commit run --all-files
